<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard</title>
<link rel="stylesheet" href="/shell.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 14px 40px; background: radial-gradient(circle at top, #1b2340, #070a14 70%) fixed;
    color: #eef2ff; font-family: system-ui, 'Segoe UI', sans-serif; min-height: 100vh; }
  main { max-width: 900px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 1.5rem; } h1 span { color: #facc15; }
  .who { color: #9aa6c7; font-size: .85rem; margin: 2px 0 0; }
  a.btn, button.btn { padding: 10px 16px; border: 0; border-radius: 12px; font-weight: 600; cursor: pointer; color: #fff;
    text-decoration: none; font-size: .9rem; background: linear-gradient(135deg, #6366f1, #22d3ee); }
  .btn.alt { background: rgba(255,255,255,.1); }
  .panel { padding: 18px; border-radius: 22px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); margin-bottom: 16px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr) 150px; gap: 12px; align-items: center; }
  @media (max-width: 640px) { .stats { grid-template-columns: repeat(3, 1fr); } .donut { grid-column: 1 / -1; margin: auto; } }
  .stat { padding: 14px; border-radius: 16px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); animation: rise .6s both; }
  .stat small { color: #9aa6c7; text-transform: uppercase; font-size: .7rem; letter-spacing: .05em; }
  .stat p { margin: 4px 0 0; font-size: 2rem; font-weight: 800; }
  .p { color: #34d399; } .l { color: #fbbf24; } .a { color: #fb7185; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .donut { width: 130px; height: 130px; border-radius: 50%; display: grid; place-items: center; transition: background .6s; background: conic-gradient(#334155 0 100%); }
  .donut div { width: 82px; height: 82px; border-radius: 50%; background: #0d1224; display: grid; place-items: center; text-align: center; font-size: .75rem; color: #9aa6c7; }
  .donut b { display: block; font-size: 1.3rem; color: #fff; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } @media (max-width: 700px) { .two { grid-template-columns: 1fr; } }
  h2 { margin: 0 0 10px; font-size: 1rem; color: #9aa6c7; font-weight: 600; }
  .hint { margin: 8px 0 0; color: #9aa6c7; font-size: .8rem; }
  form, .line { display: flex; gap: 10px; flex-wrap: wrap; }
  input[type=text], input[type=file] { flex: 1; min-width: 160px; padding: 11px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.07); color: #fff; font-size: .95rem; outline: none; }
  .msg { min-height: 1.2em; margin: 8px 0 0; font-size: .85rem; color: #fda4af; } .msg.ok { color: #34d399; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 14px; background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08); animation: rise .5s both; }
  li .name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .time { color: #9aa6c7; font-size: .8rem; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: .72rem; font-weight: 700; text-transform: uppercase; }
  .badge.present { background: rgba(16,185,129,.2); color: #34d399; }
  .badge.late { background: rgba(245,158,11,.2); color: #fbbf24; }
  .badge.absent { background: rgba(244,63,94,.2); color: #fb7185; }
  .mini { padding: 6px 10px; border: 0; border-radius: 9px; background: rgba(255,255,255,.1); color: #fff; cursor: pointer; font-size: .78rem; text-decoration: none; }
  .mini:hover { background: rgba(255,255,255,.2); } .mini.del:hover { background: rgba(244,63,94,.4); }
  .empty { color: #9aa6c7; text-align: center; padding: 18px; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1><span id="role">Dashboard</span></h1><p class="who" id="who"></p></div>
  </header>

  <section class="panel">
    <div class="stats">
      <div class="stat"><small>Present</small><p class="p" id="cp">0</p></div>
      <div class="stat" style="animation-delay:.1s"><small>Late</small><p class="l" id="cl">0</p></div>
      <div class="stat" style="animation-delay:.2s"><small>Absent</small><p class="a" id="ca">0</p></div>
      <div class="donut" id="donut"><div><span><b id="pct">0%</b>attended</span></div></div>
    </div>
  </section>

  <div class="two">
    <section class="panel">
      <h2 id="addTitle">Add one</h2>
      <form id="form"><input type="text" id="name" placeholder="Full name" maxlength="80" required /><button class="btn">Add</button></form>
      <p class="msg" id="err"></p>
    </section>
    <section class="panel">
      <h2>Import from CSV</h2>
      <div class="line"><input type="file" id="file" accept=".csv,.txt,text/csv" /><button class="btn" id="imp">Import</button></div>
      <p class="hint">One name per row. Only the first column is used, and a header row called "name" is skipped. Up to 500 names, duplicates are skipped.</p>
      <p class="msg" id="impmsg"></p>
    </section>
  </div>

  <section class="panel" id="sendPanel">
    <h2>Send report to Admin</h2>
    <div class="line">
      <input type="date" id="rfrom" /><input type="date" id="rto" />
      <input type="text" id="rnote" placeholder="Note (optional)" maxlength="300" />
      <button class="btn" id="rsend">Send to Admin</button>
    </div>
    <p class="msg" id="rmsg"></p>
    <ul id="rlist"></ul>
  </section>

  <section class="panel">
    <h2 id="title">Today</h2>
    <ul id="list"></ul>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id)
const labels = { teacher: ['Teacher dashboard', 'student', 'students'], subdirector: ['Sub-Director dashboard', 'teacher', 'teachers'], admin: ['Director dashboard', 'person', 'people'] }
let codes = {}, noun = ['student', 'students']

async function json(url, opts) {
  const r = await fetch(url, opts)
  const d = await r.json().catch(() => ({}))
  if (r.status === 401) { location.href = '/login'; throw new Error('Login required') }
  if (r.status === 403) { location.href = '/pending'; throw new Error('Not allowed') }
  if (!r.ok) throw new Error(d.error || 'Request failed')
  return d
}
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e }

async function load() {
  const [students, today] = await Promise.all([json('/api/students'), json('/api/today')])
  codes = Object.fromEntries(students.map((s) => [s.id, s.code]))
  const c = today.counts, total = c.present + c.late + c.absent
  $('cp').textContent = c.present; $('cl').textContent = c.late; $('ca').textContent = c.absent
  $('title').textContent = 'Today (' + today.day + ')'
  $('pct').textContent = total ? Math.round(((c.present + c.late) / total) * 100) + '%' : '0%'
  const a = total ? (c.present / total) * 100 : 0, b = total ? a + (c.late / total) * 100 : 0
  $('donut').style.background = total ? 'conic-gradient(#34d399 0 ' + a + '%, #fbbf24 ' + a + '% ' + b + '%, #fb7185 ' + b + '% 100%)' : 'conic-gradient(#334155 0 100%)'
  const list = $('list'); list.innerHTML = ''
  if (!today.people.length) { list.append(el('li', 'empty', 'No ' + noun[1] + ' yet. Add one or import a CSV.')); return }
  today.people.forEach((p, i) => {
    const li = el('li'); li.style.animationDelay = Math.min(i, 10) * 40 + 'ms'
    li.append(el('span', 'name', p.name))
    if (p.time) li.append(el('span', 'time', p.time))
    li.append(el('span', 'badge ' + p.status, p.status))
    const qr = el('a', 'mini', 'QR'); qr.href = '/qr/' + codes[p.id] + '.png'; qr.target = '_blank'
    const dl = el('a', 'mini', 'Save'); dl.href = qr.href; dl.download = p.name.replace(/\W+/g, '_') + '.png'
    const fc = el('a', 'mini', 'Face'); fc.href = '/enroll?id=' + p.id + '&name=' + encodeURIComponent(p.name)
    const del = el('button', 'mini del', 'Delete')
    del.onclick = async () => { if (!confirm('Delete ' + p.name + ' and their records?')) return; await json('/api/students/' + p.id, { method: 'DELETE' }); load() }
    li.append(qr, dl, fc, del); list.append(li)
  })
}

$('form').onsubmit = async (e) => {
  e.preventDefault(); $('err').textContent = ''
  try { await json('/api/students', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('name').value }) }); $('name').value = ''; load() }
  catch (x) { $('err').textContent = x.message }
}

$('imp').onclick = async () => {
  const m = $('impmsg'); m.className = 'msg'; m.textContent = ''
  const file = $('file').files[0]
  if (!file) { m.textContent = 'Choose a CSV file first.'; return }
  if (file.size > 1000000) { m.textContent = 'File is too large.'; return }
  try {
    const d = await json('/api/students/import', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ csv: await file.text() }) })
    m.className = 'msg ok'; m.textContent = 'Added ' + d.added + ', skipped ' + d.skipped + ' (duplicates or invalid).'
    $('file').value = ''; load()
  } catch (x) { m.textContent = x.message }
}



const today0 = new Date().toISOString().slice(0, 10)
$('rfrom').value = today0; $('rto').value = today0
async function loadReports() {
  const rows = await json('/api/my-reports'), ul = $('rlist'); ul.innerHTML = ''
  rows.slice(0, 5).forEach((x) => { const li = el('li'); li.append(el('span', 'name', x.from_day + ' to ' + x.to_day + ' (' + x.rows_count + ' records)'), el('span', 'time', new Date(x.created_at * 1000).toLocaleString())); ul.append(li) })
}
$('rsend').onclick = async () => {
  const m = $('rmsg'); m.className = 'msg'; m.textContent = ''
  try {
    const d = await json('/api/reports', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from: $('rfrom').value, to: $('rto').value, note: $('rnote').value }) })
    m.className = 'msg ok'; m.textContent = 'Sent ' + d.rows + ' records to the Admin.'; $('rnote').value = ''; loadReports()
  } catch (x) { m.textContent = x.message }
}

json('/api/me').then((me) => {
  const l = labels[me.role] || labels.admin
  $('role').textContent = l[0]; $('who').textContent = me.name + ' - ' + me.email
  noun = [l[1], l[2]]; $('addTitle').textContent = 'Add one ' + l[1]
  if (me.role === 'admin') $('sendPanel').remove(); else loadReports()
  load(); setInterval(load, 10000)
})
</script>
<script src="/shell.js"></script>
</body>
</html>
