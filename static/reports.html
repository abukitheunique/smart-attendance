<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reports</title>
<link rel="stylesheet" href="/shell.css" />
</head>
<body>
<div class="page">
  <h1>Submitted reports</h1>
  <p class="sub">Attendance reports sent by Teachers and Sub-Directors.</p>
  <div id="list"></div>
</div>
<script>
const names = { teacher: 'Teacher', subdirector: 'Sub-Director' }
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e }
async function load() {
  const r = await fetch('/api/reports')
  if (r.status === 401) { location.href = '/login'; return }
  if (!r.ok) { location.href = '/pending'; return }
  const rows = await r.json(), list = document.getElementById('list'); list.innerHTML = ''
  if (!rows.length) { list.append(el('p', 'muted', 'No reports yet.')); return }
  rows.forEach((x) => {
    const row = el('div', 'row'), w = el('div', 'who')
    w.append(el('b', '', x.sender + ' (' + (names[x.role] || x.role) + ')'),
      el('small', '', x.from_day + ' to ' + x.to_day + ' - ' + x.rows_count + ' records - sent ' + new Date(x.created_at * 1000).toLocaleString()))
    if (x.note) w.append(el('small', '', 'Note: ' + x.note))
    const dl = el('a', 'btn', 'Download CSV'); dl.href = '/api/reports/' + x.id + '.csv'
    row.append(w, dl); list.append(row)
  })
}
load(); setInterval(load, 20000)
</script>
<script src="/shell.js"></script>
</body>
</html>
