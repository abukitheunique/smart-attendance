<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Enroll Face</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(circle at top, #1b2340, #070a14 70%); color: #eef2ff; font-family: system-ui, 'Segoe UI', sans-serif; }
  .card { width: 100%; max-width: 460px; padding: 22px; border-radius: 26px; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  h1 { margin: 0 0 4px; font-size: 1.4rem; } h1 span { color: #facc15; }
  .sub { margin: 0 0 14px; color: #9aa6c7; font-size: .9rem; }
  .view { position: relative; border-radius: 18px; overflow: hidden; background: #000; aspect-ratio: 4/3; }
  video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
  .oval { position: absolute; inset: 10% 26%; border: 3px dashed #facc15; border-radius: 50%; pointer-events: none; }
  .bar { height: 10px; margin-top: 14px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #6366f1, #22d3ee); transition: width .3s; }
  #msg { margin: 12px 0 0; min-height: 1.4em; text-align: center; font-weight: 600; }
  .row { display: flex; gap: 10px; margin-top: 14px; }
  button, a.b { flex: 1; padding: 12px; border: 0; border-radius: 12px; font-weight: 700; cursor: pointer; color: #fff;
    text-align: center; text-decoration: none; font-size: .95rem; background: linear-gradient(135deg, #6366f1, #22d3ee); }
  button.alt, a.alt { background: rgba(255,255,255,.1); }
  button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<main class="card">
  <h1>Enroll <span id="who">face</span></h1>
  <p class="sub">Good light, no hat or sunglasses. Follow the prompts while the bar fills.</p>
  <div class="view"><video id="video" playsinline muted></video><div class="oval"></div></div>
  <div class="bar"><i id="fill"></i></div>
  <p id="msg">Press Start when ready.</p>
  <div class="row">
    <button id="start">Start</button>
    <button id="clear" class="alt">Clear data</button>
    <a class="b alt" href="/admin">Back</a>
  </div>
</main>
<script>
const q = new URLSearchParams(location.search)
const id = q.get('id'), name = q.get('name') || 'student'
document.getElementById('who').textContent = name
const video = document.getElementById('video'), msg = document.getElementById('msg'), fill = document.getElementById('fill')
const startBtn = document.getElementById('start')
const TARGET = 15
const prompts = ['Look straight at the camera', 'Turn slightly to the left', 'Turn slightly to the right', 'Look straight and smile', 'Tilt your head a little']
const canvas = document.createElement('canvas'), ctx = canvas.getContext('2d')

navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 }, audio: false })
  .then((s) => { video.srcObject = s; video.play() })
  .catch(() => { msg.textContent = 'Camera unavailable. Allow access (localhost or https only).' })

const wait = (ms) => new Promise((r) => setTimeout(r, ms))

startBtn.onclick = async () => {
  if (!id) { msg.textContent = 'Open this page from the admin list.'; return }
  startBtn.disabled = true
  let ok = 0, fails = 0
  while (ok < TARGET && fails < 25) {
    msg.textContent = prompts[Math.floor(ok / 3) % prompts.length] + ' (' + ok + '/' + TARGET + ')'
    canvas.width = 480; canvas.height = Math.round(480 * video.videoHeight / video.videoWidth)
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height)
    try {
      const r = await fetch('/api/students/' + id + '/face', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image: canvas.toDataURL('image/jpeg', 0.85) }) })
      if (r.ok) { ok++; fill.style.width = (ok / TARGET) * 100 + '%' } else { fails++ }
    } catch (e) { fails++ }
    await wait(450)
  }
  msg.textContent = ok >= TARGET ? 'Done. Face enrolled.' : 'Only ' + ok + ' good frames. Improve the light and try again.'
  startBtn.disabled = false
}

document.getElementById('clear').onclick = async () => {
  if (!id || !confirm('Delete all face data for ' + name + '?')) return
  await fetch('/api/students/' + id + '/face', { method: 'DELETE' })
  fill.style.width = '0'; msg.textContent = 'Face data deleted.'
}
</script>
</body>
</html>
