<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Overview</title>
<link rel="stylesheet" href="/shell.css" />
</head>
<body>
<div class="page">
  <h1>Overview</h1>
  <p class="sub">Applications, people and the reports sent to you.</p>
  <div class="grid">
    <a class="stat" href="/admin/applications"><small>Pending applications</small><p id="pending">0</p></a>
    <a class="stat" href="/admin/people"><small>Sub-Directors</small><p id="subs">0</p></a>
    <a class="stat" href="/admin/people"><small>Teachers</small><p id="teachers">0</p></a>
    <div class="stat"><small>People tracked</small><p id="people">0</p></div>
    <a class="stat" href="/admin/reports"><small>Reports received</small><p id="reports">0</p></a>
  </div>
  <h2 class="sec">Latest reports</h2>
  <div id="recent"></div>
</div>
<script>
const $ = (id) => document.getElementById(id)
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e }
const names = { teacher: 'Teacher', subdirector: 'Sub-Director' }
async function get(url) {
  const r = await fetch(url)
  if (r.status === 401) { location.href = '/login'; throw new Error('login') }
  if (!r.ok) { location.href = '/pending'; throw new Error('denied') }
  return r.json()
}
async function load() {
  const s = await get('/api/admin/stats')
  $('pending').textContent = s.pending; $('subs').textContent = s.subdirectors; $('teachers').textContent = s.teachers
  $('people').textContent = s.people; $('reports').textContent = s.reports
  const rows = (await get('/api/reports')).slice(0, 5), box = $('recent'); box.innerHTML = ''
  if (!rows.length) { box.append(el('p', 'muted', 'No reports yet.')); return }
  rows.forEach((x) => {
    const row = el('div', 'row'), w = el('div', 'who')
    w.append(el('b', '', x.sender + ' (' + (names[x.role] || x.role) + ')'), el('small', '', x.from_day + ' to ' + x.to_day + ' - ' + x.rows_count + ' records'))
    const dl = el('a', 'btn', 'Download'); dl.href = '/api/reports/' + x.id + '.csv'
    row.append(w, dl); box.append(row)
  })
}
load(); setInterval(load, 20000)
</script>
<script src="/shell.js"></script>
</body>
</html>
