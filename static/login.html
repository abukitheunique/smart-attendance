<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log in</title>
<link rel="stylesheet" href="/auth.css" />
</head>
<body>
<main class="card">
  <h1>Smart <span>Attendance</span></h1>
  <p>Log in to your account.</p>
  <form id="f">
    <input id="email" type="email" placeholder="Email" autocomplete="username" required autofocus />
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required />
    <button id="go">Log in</button>
    <p class="err" id="err"></p>
  </form>
  <a class="link" href="/signup">No account? Apply as a Teacher or Sub-Director</a>
  <a class="link" href="/">Back to scanner</a>
</main>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault()
  const btn = document.getElementById('go'), err = document.getElementById('err')
  btn.disabled = true; err.textContent = ''
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('pw').value }) })
    const d = await r.json().catch(() => ({}))
    if (r.ok) location.href = d.role === 'admin' && d.status === 'approved' ? '/admin' : d.status === 'approved' ? '/dashboard' : '/pending'
    else err.textContent = d.error || 'Login failed'
  } catch (x) { err.textContent = 'Could not reach the server' }
  btn.disabled = false
}
</script>
</body>
</html>
