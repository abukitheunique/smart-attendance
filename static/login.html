<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Login</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(circle at top, #1b2340, #070a14 70%); color: #eef2ff; font-family: system-ui, 'Segoe UI', sans-serif; }
  form { width: 100%; max-width: 380px; padding: 26px; border-radius: 24px; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12); box-shadow: 0 30px 80px rgba(0,0,0,.45); animation: rise .6s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } }
  h1 { margin: 0 0 6px; font-size: 1.5rem; } h1 span { color: #facc15; }
  p { margin: 0 0 18px; color: #9aa6c7; font-size: .9rem; }
  input { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.07); color: #fff; font-size: 1rem; outline: none; }
  input:focus { border-color: #818cf8; }
  button { width: 100%; margin-top: 14px; padding: 13px; border: 0; border-radius: 12px; font-weight: 700; font-size: 1rem;
    color: #fff; cursor: pointer; background: linear-gradient(135deg, #6366f1, #22d3ee); }
  button:disabled { opacity: .6; }
  #err { min-height: 1.2em; margin: 10px 0 0; color: #fda4af; font-size: .88rem; }
  a { color: #22d3ee; text-decoration: none; font-size: .85rem; display: block; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<form id="f">
  <h1>Admin <span>Login</span></h1>
  <p>Enter the admin password to manage students.</p>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus required />
  <button id="go">Log in</button>
  <p id="err"></p>
  <a href="/">Back to scanner</a>
</form>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault()
  const btn = document.getElementById('go'), err = document.getElementById('err')
  btn.disabled = true; err.textContent = ''
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('pw').value }) })
    const d = await r.json().catch(() => ({}))
    if (r.ok) location.href = '/admin'
    else err.textContent = d.error || 'Login failed'
  } catch (x) { err.textContent = 'Could not reach the server' }
  btn.disabled = false
}
</script>
</body>
</html>
